<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord виджет</title>
<style>
  :root{ --accent:#5865F2; --accent2:#00D3FF; --w:340px; --h:480px; --r:16px; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080A11;
       font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#EDEFFA}
  .dw{width:var(--w);max-width:calc(100vw - 20px);height:var(--h);display:flex;flex-direction:column;
      border:1px solid #2A3050;border-radius:var(--r);overflow:hidden;
      background:linear-gradient(160deg,#171B2E,#1E2340);
      box-shadow:0 24px 60px -28px #000,0 0 44px -12px var(--accent)}
  .top{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #2A3050}
  .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;
       background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;flex:none}
  .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;color:#98A0C4;display:flex;gap:6px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:#43E27A;flex:none}
  .badge{margin-left:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
         color:#98A0C4;border:1px solid #2A3050;border-radius:6px;padding:2px 6px}
  .badge.live{background:#43E27A;border-color:transparent;color:#0A0B12;font-weight:700}
  .badge.off{background:#ED4245;border-color:transparent;color:#fff}
  .body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;
        scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
  .body::-webkit-scrollbar{width:8px}
  .body::-webkit-scrollbar-thumb{border-radius:99px;background:var(--accent)}
  .sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#98A0C4;margin-top:4px}
  .row{display:flex;gap:8px;align-items:center;padding:6px;border-radius:8px;background:rgba(255,255,255,.03)}
  .av{position:relative;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
      font-size:10px;font-weight:700;color:#fff;flex:none}
  .av i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid #171B2E}
  .online i{background:#43E27A}.idle i{background:#FAA61A}.dnd i{background:#ED4245}.offline i{background:#6D7499}
  .un{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .game{margin-left:auto;font-size:10px;color:#98A0C4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .ch{font-size:11px;color:#98A0C4;padding:5px 7px;border-radius:7px;background:rgba(255,255,255,.03)}
  .join{display:block;margin:10px;padding:10px;border-radius:10px;text-align:center;text-decoration:none;
        font-weight:700;font-size:13px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2))}
  .join:hover{filter:brightness(1.1)}
  .empty{font-size:12px;color:#98A0C4;text-align:center;padding:18px 8px;border:1px dashed #2A3050;border-radius:10px}
</style>
</head>
<body>
<div class="dw">
  <div class="top">
    <div class="ico" id="ico">DS</div>
    <div style="min-width:0">
      <div class="name" id="name">Загрузка…</div>
      <div class="sub"><span class="dot"></span><b id="online">—</b> в сети</div>
    </div>
    <span class="badge" id="badge">демо</span>
  </div>
  <div class="body" id="body"></div>
  <a class="join" id="join" href="#" target="_blank" rel="noopener">Присоединиться</a>
</div>
<script>
/* ===== НАСТРОЙКИ: правьте только эти строки ===== */
var SERVER_ID     = "1571135176157954130";  /* ID вашего сервера, 17–20 цифр */
var INVITE        = "https://discord.gg/nwkTtuBve";  /* ссылка-приглашение */
var MAX_MEMBERS   = 8;    /* сколько участников показывать */
var SHOW_CHANNELS = true; /* показывать голосовые каналы */
/* ================================================ */
var FALLBACK = { name:"Мой сервер", presence_count:0, members:[], channels:[] };
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ini(n){var p=String(n||"?").trim().split(/\s+/);return (p.length>1?p[0][0]+p[1][0]:String(n||"?").slice(0,2)).toUpperCase()}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))|0;return Math.abs(h)%360}
function paint(d,live){
  document.getElementById("name").textContent=d.name||"Discord сервер";
  document.getElementById("ico").textContent=ini(d.name);
  document.getElementById("online").textContent=d.presence_count!=null?d.presence_count:(d.members||[]).length;
  var b=document.getElementById("badge");
  b.textContent=live?"live":"демо"; b.className="badge"+(live?" live":"");
  document.getElementById("join").href=d.instant_invite||INVITE;
  var h="", list=(d.members||[]).slice(0,MAX_MEMBERS);
  if(list.length){
    h+='<div class="sec">В сети</div>';
    h+=list.map(function(m){
      var st=m.status||"online", hh=hue(m.username||"?");
      return '<div class="row"><span class="av '+esc(st)+'" style="background:linear-gradient(140deg,hsl('+hh+',70%,55%),hsl('+((hh+60)%360)+',70%,45%))">'+esc(ini(m.username))+'<i></i></span>'+
             '<span class="un">'+esc(m.username)+'</span>'+
             (m.game&&m.game.name?'<span class="game">'+esc(m.game.name)+'</span>':'')+'</div>';
    }).join("");
  } else h+='<div class="empty">Никого нет в сети или виджет выключен на сервере</div>';
  if(SHOW_CHANNELS&&(d.channels||[]).length){
    h+='<div class="sec">Голосовые каналы</div>';
    h+=d.channels.slice(0,4).map(function(c){return '<div class="ch">🔊 '+esc(c.name)+'</div>'}).join("");
  }
  document.getElementById("body").innerHTML=h;
}
paint(FALLBACK,false);
if(/^\d{17,20}$/.test(SERVER_ID)){
  fetch("https://discord.com/api/guilds/"+SERVER_ID+"/widget.json",{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(d){paint(d,true)})
    .catch(function(){var b=document.getElementById("badge");b.textContent="офлайн";b.className="badge off"});
}
</script>
</body>
</html>
